<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<link rel="icon" type="image/png" sizes="128x128" href="assets/favicon.png?v=3">
<meta name="robots" content="noindex,nofollow">
<title>Feedback Admin | BLOOM CREATIVES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080808;--panel:#141414;--line:#ffffff20;--white:#f5f5f2;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#242424 0,transparent 38%),var(--bg);color:var(--white);font-family:'Outfit',sans-serif;min-height:100vh}.wrap{width:min(1000px,92%);margin:auto;padding:70px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:45px}.brand{display:inline-flex;align-items:center;min-width:150px}.brand img{display:block;width:160px;max-width:42vw;height:auto;max-height:42px;object-fit:contain}.brand:focus-visible{outline:2px solid #f5f5f2;outline-offset:5px}.top>a:last-child{font-size:13px;letter-spacing:.02em;text-underline-offset:4px}.top>a:last-child:hover{color:#fff}.muted,.hint{color:var(--muted)}h1{font:500 clamp(38px,7vw,64px)/1 'Outfit';letter-spacing:-.06em;margin:12px 0}.panel,.review{border:1px solid var(--line);background:linear-gradient(145deg,#191919eF,#0d0d0d);border-radius:18px;padding:26px}.login{max-width:460px;margin:45px auto}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:12px;color:#bbb}.field input{width:100%;padding:14px;border:1px solid #ffffff30;border-radius:10px;background:#090909;color:#fff;font:inherit}.btn{border:1px solid #eee;border-radius:999px;padding:12px 20px;background:#f5f5f2;color:#080808;font-weight:700;cursor:pointer}.btn.secondary{background:transparent;color:#eee;border-color:#555}.btn:disabled{opacity:.5;cursor:wait}.status{min-height:24px;color:#c8c8c3;font-size:13px;line-height:1.6}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #ffffff30;border-radius:999px;background:transparent;color:#bbb;padding:9px 15px;cursor:pointer}.tab.active{background:#f5f5f2;color:#080808}.reviews{display:grid;gap:14px}.review-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.stars{color:#e8c66a;letter-spacing:2px}.review p{color:#ccc;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:#888;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.empty{padding:28px;color:#999;border:1px dashed #ffffff30;border-radius:14px;text-align:center}.danger{border-color:#8b5555!important;color:#f0baba!important}@media(max-width:600px){.wrap{padding:35px 0}.panel,.review{padding:19px}.top{align-items:center}.brand img{width:130px;max-width:38vw}.top>a:last-child{font-size:12px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><a class="brand" href="/" aria-label="BLOOM CREATIVES home"><img src="assets/bloom-logo.svg?v=3" alt="BLOOM CREATIVES"></a><a class="muted" href="/">← Back to website</a></div>
  <section id="loginPanel" class="panel login">
    <span class="muted">PRIVATE ADMIN AREA</span><h1>Feedback<br>dashboard.</h1>
    <p class="hint">Sign in with the portfolio owner's Supabase account to review and moderate client feedback.</p>
    <form id="loginForm">
      <div class="field"><label for="adminEmail">Admin email</label><input id="adminEmail" type="email" value="chenithakodithuwakku999@gmail.com" autocomplete="username" required></div>
      <div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit">Sign in ↗</button><p id="loginStatus" class="status" role="status"></p>
    </form>
  </section>
  <section id="dashboard" hidden>
    <span class="muted">PRIVATE ADMIN AREA</span><h1>Client feedback.</h1>
    <p class="hint">Approve reviews to publish them on the public portfolio. Rejected reviews remain private.</p>
    <div class="toolbar"><div class="tabs" role="group" aria-label="Filter feedback"><button class="tab active" data-filter="pending">Pending</button><button class="tab" data-filter="approved">Published</button><button class="tab" data-filter="all">All reviews</button></div><button id="signOut" class="btn secondary">Sign out</button></div>
    <p id="dashboardStatus" class="status" role="status"></p><div id="reviews" class="reviews"><div class="empty">Loading feedback…</div></div>
  </section>
</main>
<script src="js/admin.js" defer></script>
</body>
</html>
