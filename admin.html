<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYNTRO · Review Admin</title><link rel="stylesheet" href="css/style.css"><style>
body{min-height:100vh;background:#080808;color:#fff}.admin-wrap{max-width:900px;margin:0 auto;padding:70px 22px}.admin-panel{border:1px solid #ffffff24;background:#ffffff0b;backdrop-filter:blur(22px);border-radius:24px;padding:28px}.admin-panel input{display:block;width:100%;margin:10px 0 16px;padding:14px;border:1px solid #ffffff28;border-radius:12px;background:#ffffff0b;color:#fff}.admin-panel button{margin:8px 8px 0 0}.admin-review{border:1px solid #ffffff20;border-radius:16px;padding:18px;margin:14px 0}.admin-review p{line-height:1.6}.admin-note{color:#aaa;font-size:13px}
</style></head><body><main class="admin-wrap"><a href="index.html">← Back to VYNTRO</a><h1>Feedback moderation</h1><p class="admin-note">Sign in with your authorized admin account to review submissions.</p><section class="admin-panel" id="loginPanel"><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button class="button" id="login">Sign in</button><p id="status" class="admin-note" aria-live="polite"></p></section><section id="dashboard" hidden><button class="button secondary" id="logout">Sign out</button><div id="pendingList"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://fcjrqzohjakjxvhruubc.supabase.co","sb_publishable_RkG0M_heNrwIpWmmjOHZZg_fSNth8Ew");
const statusEl=document.getElementById("status");
async function enter(){const {data:{user}}=await db.auth.getUser();if(!user)return;if(user.app_metadata?.role!=="admin"){statusEl.textContent="This account is not authorized as a VYNTRO admin.";return}document.getElementById("loginPanel").hidden=true;document.getElementById("dashboard").hidden=false;loadPending()}
async function loadPending(){const host=document.getElementById("pendingList");host.textContent="Loading…";const {data,error}=await db.from("vyntro_feedback").select("*").eq("status","pending").order("created_at",{ascending:false});if(error){host.textContent="Could not load reviews.";return}host.replaceChildren();if(!data.length){host.textContent="No pending feedback.";return}data.forEach(r=>{const card=document.createElement("article");card.className="admin-review";const title=document.createElement("strong");title.textContent=r.display_name+" · "+"★".repeat(r.rating);const msg=document.createElement("p");msg.textContent=r.message;const approve=document.createElement("button");approve.className="button";approve.textContent="Approve";approve.onclick=()=>moderate(r.id,"approved");const reject=document.createElement("button");reject.className="button secondary";reject.textContent="Reject";reject.onclick=()=>moderate(r.id,"rejected");card.append(title,msg,approve,reject);host.append(card)})}
async function moderate(id,status){const {error}=await db.from("vyntro_feedback").update({status}).eq("id",id);if(error){alert("Could not update review.");return}loadPending()}
document.getElementById("login").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});statusEl.textContent=error?error.message:"Signed in.";if(!error)enter()};
document.getElementById("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
enter();
</script></body></html>
